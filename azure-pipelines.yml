trigger: none

pool:
  name: $(pool)

variables:
- group: New variable group 22-Apr

- name: WorkDir
  value: '$(System.DefaultWorkingDirectory)/env/dev'

stages:

# ---------------- CLEANUP ----------------
- stage: Cleanup
  jobs:
    - job: Clean
      steps:
        - checkout: self
          clean: true

# ---------------- BUILD ----------------
- stage: Build
  dependsOn: Cleanup
  jobs:
    - job: TerraformBuild
      steps:

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(WorkDir)'
            backendServiceArm: 'Taskify-SC'
            backendAzureRmResourceGroupName: 'rg-pip'
            backendAzureRmStorageAccountName: 'strpipeline123'
            backendAzureRmContainerName: 'containerpipeline'
            backendAzureRmKey: 'keystatefile1'

        - task: TerraformTask@5
          displayName: Validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(WorkDir)'

        - task: TerraformTask@5
          displayName: Plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(WorkDir)'
            environmentServiceNameAzureRM: 'Taskify-SC'

# ---------------- PARALLEL SCANS ----------------
- stage: SecurityScans
  dependsOn: Build
  jobs:

    # TFSEC
    - job: tfsecScan
      displayName: TFSEC Scan
      steps:
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'
            dir: '$(System.DefaultWorkingDirectory)'

    # CHECKOV
    - job: checkovScan
      displayName: Checkov Scan
      steps:
        - task: PowerShell@2
          inputs:
            targetType: inline
            script: |
              checkov -d . --framework terraform --soft-fail

    # TFLINT
    - job: tflintScan
      displayName: TFLint Scan
      continueOnError: true
      steps:
        - task: PowerShell@2
          inputs:
            targetType: inline
            script: |
              tflint --init
              tflint --recursive

    # TERRASCAN
    - job: terrascanScan
      displayName: Terrascan Scan
      steps:
        - task: PowerShell@2
          inputs:
            targetType: inline
            script: |
              terrascan init
              terrascan scan

    # KICS
    - job: kicsScan
      displayName: KICS Scan
      continueOnError: true
      steps:
        - task: PowerShell@2
          inputs:
            targetType: inline
            script: |
              kics scan -p .

    # INFRACOST
    - job: infracostScan
      displayName: Infracost
      steps:
        - task: PowerShell@2
          inputs:
            targetType: inline
            script: |
              infracost breakdown --path .

# ---------------- DEPLOY ----------------
- stage: Deploy
  dependsOn: SecurityScans
  jobs:

    - job: TerraformApply
      steps:

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(WorkDir)'
            backendServiceArm: 'Taskify-SC'
            backendAzureRmResourceGroupName: 'rg-pip'
            backendAzureRmStorageAccountName: 'strpipeline123'
            backendAzureRmContainerName: 'containerpipeline'
            backendAzureRmKey: 'keystatefile1'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(WorkDir)'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'Taskify-SC'