trigger:
  enabled: false
parameters:
- name: branchName
  displayName: Select Branch
  type: string
  default: main
- name: terraformCommand
  displayName: Select Terraform Command
  type: string
  default: init
  values:
  - init
  - validate
  - fmt
  - plan
  - apply
pool:
  name: $(pool)
variables:
- group: New variable group 22-Apr
- name: WorkDir
  value: '$(System.DefaultWorkingDirectory)/env/dev'
stages:
- stage: cleaing
  displayName: cleanup
  jobs:
  - job: cleanup
    displayName: "clean"
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        clean: true
- stage: Build
  displayName: buildstage
  jobs:
  - job: TerraformInittoPlan
    displayName: "terraform Init to plan"
    steps:
    - task: TerraformTask@5
      displayName: "Init"
      condition: eq('init','init')
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(WorkDir)'
        backendServiceArm: 'Taskify-SC'
        backendAzureRmResourceGroupName: 'rg-pip'
        backendAzureRmStorageAccountName: 'strpipeline123'
        backendAzureRmContainerName: 'containerpipeline'
        backendAzureRmKey: 'keystatefile1'
    - task: TerraformTask@5
      displayName: "validate"
      condition: or( eq('init','init'), eq('init','validate') )
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(WorkDir)'
    - task: TerraformTask@5
      displayName: "FMT"
      condition: or( eq('init','init'), eq('init','validate'), eq('init','fmt') )
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(WorkDir)'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'Taskify-SC'
    - task: TerraformTask@5
      displayName: "Plan"
      condition: or( eq('init','init'), eq('init','validate'), eq('init','fmt'), eq('init','plan') )
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(WorkDir)'
        environmentServiceNameAzureRM: 'Taskify-SC'
- stage: ''
  displayName: Scanning
  jobs:
  - job: SecurityScanning
    displayName: 'SecurityScanning'
    steps:
    - task: tfsec@1
      inputs:
        version: 'v1.26.0'
        dir: '$(System.DefaultWorkingDirectory)'
- stage: SecurityScan
  displayName: "Security Scanning (Checkov)"
  jobs:
  - job: CheckovScan
    displayName: "Run Checkov IaC Scan"
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'checkov -d . --framework terraform --soft-fail -o cli > checkov-report.txt'
    - task: PublishBuildArtifacts@1
      displayName: "Publish Checkov Report"
      inputs:
        pathToPublish: 'checkov-report.txt'
        artifactName: 'checkov-report'
        publishLocation: 'Container'
- stage: InfraCost
  displayName: Infra-cost
  jobs:
  - job: Infracost
    displayName: infracost
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'infracost breakdown --path .'
- stage: SuperLinter
  displayName: Linting
  jobs:
  - job: TfLint
    displayName: "Lint"
    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          tflint --init
          tflint
          tflint --recursive
- stage: Deploy
  displayName: Deploy
  jobs:
  - job: TerraformApply
    displayName: "Apply"
    condition: eq('init', 'apply')
    pool:
      name: '$(pool)'
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(WorkDir)'
        backendServiceArm: 'Taskify-SC'
        backendAzureRmResourceGroupName: 'rg-pip'
        backendAzureRmStorageAccountName: 'strpipeline123'
        backendAzureRmContainerName: 'containerpipeline'
        backendAzureRmKey: 'keystatefile1'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(WorkDir)'
        commandOptions: '-auto-approve'
        environmentServiceNameAzureRM: 'Taskify-SC'

