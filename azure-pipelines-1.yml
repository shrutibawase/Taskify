trigger: none

pool:
  name: $(pool)

variables:
- group: New variable group 22-Apr

stages:
# ==========================================
# BUILD STAGE
# ==========================================
- stage: Build
  displayName: Build WAR

  jobs:
  - job: MavenBuild

    steps:

    - task: PowerShell@2
      displayName: Maven Build
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)\JavaLoginPage'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:MAVEN_HOME="D:\Shruti\Tools\apache-maven-3.9.12"

          $env:PATH="$env:JAVA_HOME\bin;$env:MAVEN_HOME\bin;$env:PATH"

          java -version
          mvn -version

          mvn clean package

    - task: PublishBuildArtifacts@1
      displayName: Publish WAR
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)\JavaLoginPage\target'
        ArtifactName: 'java-war'
        publishLocation: 'Container'

- stage: Static_Analysis 
  jobs: 
    - job: staticAnalysis
      displayName: STatic Analysis(SonarQube)
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: 'sonar -D sonar.host.url=http://localhost:9000 -D sonar.token=sqp_a8700a091dc063381d5b3181b01f1c8eeded65ce -D sonar.projectKey=taskify_app'
  

# ==========================================
# DEPLOY STAGE
# ==========================================
- stage: Deploy
  displayName: Deploy To Tomcat
  dependsOn: Build

  jobs:
  - job: DeployWAR

    steps:

    # Download Artifact
    - download: current
      artifact: java-war

    # Stop Tomcat
    - task: PowerShell@2
      displayName: Stop Tomcat
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "Stopping Tomcat..."

          net stop Tomcat9

          Start-Sleep -Seconds 15

    # Clean old deployment
    - task: PowerShell@2
      displayName: Clean Old WAR
      inputs:
        targetType: 'inline'
        script: |

          Remove-Item `
          "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps\JavaLoginShowcase*" `
          -Recurse -Force -ErrorAction SilentlyContinue

    # Copy new WAR
    - task: PowerShell@2
      displayName: Copy WAR
      inputs:
        targetType: 'inline'
        script: |

          Copy-Item `
          "$(Pipeline.Workspace)\java-war\*.war" `
          "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps\" `
          -Force

          Write-Host "WAR Copied"

    # Start Tomcat
    - task: PowerShell@2
      displayName: Start Tomcat
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "Starting Tomcat..."

          net start Tomcat9

          Start-Sleep -Seconds 30

    # Verify Deployment
    - task: PowerShell@2
      displayName: Verify Deployment
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "Checking Port 8080..."

          netstat -ano | findstr 8080

          Write-Host ""
          Write-Host "Tomcat URL:"
          Write-Host "http://localhost:8080"

          Write-Host ""
          Write-Host "Application URL:"
          Write-Host "http://localhost:8080/JavaLoginShowcase-1.0.0"