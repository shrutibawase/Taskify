trigger: none

pool:
  name: $(pool)

variables:
  - group: New variable group 22-Apr

stages:
- stage: Build
  jobs:
  - job: MavenBuild
    steps:

    - task: PowerShell@2
      displayName: Check Java and Maven
      inputs:
        targetType: 'inline'
        script: |
          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"
          $env:PATH="$($env:JAVA_HOME)\bin;$env:PATH"
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Write-Host "PATH = $env:PATH"
          & java -version
          & mvn --version

    - task: PowerShell@2
      displayName: Maven Clean Package
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)\JavaLoginPage'
        script: |
          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"
          $env:PATH="$($env:JAVA_HOME)\bin;D:\Shruti\Tools\apache-maven-3.9.12\bin;$env:PATH"
          & mvn clean package

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)\JavaLoginPage\target'
        ArtifactName: 'java-war'
        publishLocation: 'Container'


- stage: Deploy
  displayName: Deploy to Tomcat

  dependsOn: Build

  jobs:
  - job: TomcatDeploy

    steps:

    # Download Artifact
    - download: current
      artifact: java-war

    # Stop Tomcat
    - task: PowerShell@2
      displayName: Stop Tomcat
      inputs:
        targetType: 'inline'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:CATALINA_HOME="D:\Shruti\Tools\apache-tomcat-9.0.118"

          $env:PATH="$env:JAVA_HOME\bin;$env:CATALINA_HOME\bin;$env:PATH"

          & "D:\Shruti\Tools\apache-tomcat-9.0.118\bin\shutdown.bat"

          Start-Sleep -Seconds 10

    # Copy WAR File
    - task: PowerShell@2
      displayName: Copy WAR File
      inputs:
        targetType: 'inline'
        script: |

          Copy-Item `
          "$(Pipeline.Workspace)\java-war\*.war" `
          "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps\" `
          -Force

    # Start Tomcat
    - task: PowerShell@2
      displayName: Start Tomcat
      inputs:
        targetType: 'inline'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:CATALINA_HOME="D:\Shruti\Tools\apache-tomcat-9.0.118"

          $env:PATH="$env:JAVA_HOME\bin;$env:CATALINA_HOME\bin;$env:PATH"

          & "D:\Shruti\Tools\apache-tomcat-9.0.118\bin\startup.bat"

          Start-Sleep -Seconds 20

    # Verify Deployment
    - task: PowerShell@2
      displayName: Verify Application
      inputs:
        targetType: 'inline'
        script: |

          Write-Host "Application deployed successfully"

          Write-Host "Open Browser:"

          Write-Host "http://localhost:8080/JavaLoginShowcase"