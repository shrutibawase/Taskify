trigger: none

pool:
  name: $(pool)

variables:
- group: New variable group 22-Apr

stages:
# ==========================================
# BUILD STAGE
# ==========================================
- stage: Build
  displayName: Build WAR

  jobs:
  - job: MavenBuild

    steps:

    - task: PowerShell@2
      displayName: Maven Build

      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)\JavaLoginPage'

        script: |
          # JAVA
          $env:JAVA_HOME="C:\Program Files\Eclipse Adoptium\jdk-21.0.11.10-hotspot"

          # MAVEN
          $env:MAVEN_HOME="D:\Shruti\Tools\apache-maven-3.9.12"

          # M2_HOME
          $env:M2_HOME=$env:MAVEN_HOME

          # PATH
          $env:Path="$env:JAVA_HOME\bin;$env:MAVEN_HOME\bin;$env:Path"

          Write-Host "JAVA_HOME = $env:JAVA_HOME"

          # VERIFY JAVA
          & "$env:JAVA_HOME\bin\java.exe" -version

          # VERIFY MAVEN
          & "$env:MAVEN_HOME\bin\mvn.cmd" -version

          # BUILD
          & "$env:MAVEN_HOME\bin\mvn.cmd" clean package

    - task: PublishBuildArtifacts@1
      displayName: Publish WAR

      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)\JavaLoginPage\target'
        ArtifactName: 'java-war'
        publishLocation: 'Container'
        
- stage: Static_Analysis 
  jobs: 
    - job: staticAnalysis
      displayName: STatic Analysis(SonarQube)
      steps:
      - task: PowerShell@2
        inputs:
          targetType: 'inline'
          script: 'sonar -D sonar.host.url=http://localhost:9000 -D sonar.token=sqp_a8700a091dc063381d5b3181b01f1c8eeded65ce -D sonar.projectKey=taskify_app'
  

# ==========================================
# DEPLOY STAGE
# ==========================================
- stage: Deploy
  displayName: Deploy To Tomcat

  dependsOn:
  - Build
  - Static_Analysis

  jobs:
  - job: DeployWAR
    displayName: Deploy WAR To Tomcat

    steps:

    # ==========================================
    # DOWNLOAD ARTIFACT
    # ==========================================
    - download: current
      artifact: java-war

    # ==========================================
    # CHECK TOMCAT SERVICE
    # ==========================================
    - task: PowerShell@2
      displayName: Check Tomcat Service

      inputs:
        targetType: 'inline'
        script: |

          Write-Host "===== CHECKING TOMCAT SERVICE ====="

          $service = Get-Service -Name "Tomcat9" -ErrorAction SilentlyContinue

          if ($null -eq $service) {
              Write-Error "Tomcat9 service NOT found"
              exit 1
          }

          Write-Host "Tomcat Service Found"

    # ==========================================
    # STOP TOMCAT
    # ==========================================
    - task: PowerShell@2
      displayName: Stop Tomcat

      inputs:
        targetType: 'inline'
        script: |

          Write-Host "===== STOPPING TOMCAT ====="

          $service = Get-Service -Name "Tomcat9"

          if ($service.Status -eq 'Running') {

              Stop-Service -Name "Tomcat9" -Force

              Start-Sleep -Seconds 15

              Write-Host "Tomcat Stopped Successfully"
          }
          else {

              Write-Host "Tomcat Already Stopped"
          }

    # ==========================================
    # CLEAN OLD DEPLOYMENT
    # ==========================================
    - task: PowerShell@2
      displayName: Clean Old WAR

      inputs:
        targetType: 'inline'
        script: |

          Write-Host "===== CLEANING OLD DEPLOYMENT ====="

          $webappsPath = "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps"

          Remove-Item `
          "$webappsPath\JavaLoginShowcase*" `
          -Recurse `
          -Force `
          -ErrorAction SilentlyContinue

          Write-Host "Old WAR Removed"

    # ==========================================
    # COPY NEW WAR
    # ==========================================
    - task: PowerShell@2
      displayName: Copy WAR

      inputs:
        targetType: 'inline'
        script: |

          Write-Host "===== COPYING NEW WAR ====="

          $source = "$(Pipeline.Workspace)\java-war\*.war"

          $destination = "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps\"

          Copy-Item `
          $source `
          $destination `
          -Force

          Write-Host "WAR Copied Successfully"

    # ==========================================
    # START TOMCAT
    # ==========================================
    - task: PowerShell@2
      displayName: Start Tomcat
      inputs:
        targetType: inline
        script: |
          $env:JAVA_HOME = "C:\Program Files\Eclipse Adoptium\jdk-21.0.11.10-hotspot"
          $env:CATALINA_HOME = "D:\Shruti\Tools\apache-tomcat-9.0.118"
          $env:Path = "$env:JAVA_HOME\bin;$env:CATALINA_HOME\bin;$env:Path"

          & "$env:CATALINA_HOME\bin\startup.bat"
          Start-Sleep -Seconds 30

    - task: PowerShell@2
      displayName: Verify Deployment
      inputs:
        targetType: inline
        script: |
          Invoke-WebRequest "http://localhost:8080/JavaLoginShowcase-1.0.0" -UseBasicParsing


- stage: dast
  displayName: DAST_Scanning
  dependsOn:
  - deploy
  jobs:
  - job: ZAPScan
    displayName: OWASP_ZAP_Scan
    steps:
    - task: PowerShell@2
      displayName: Run OWASP ZAP Scan
      inputs:
        targetType: inline
        script: |
          taskkill /F /IM java.exe /T 2>$null
          Start-Sleep -Seconds 5

          $zapHome = "$(Build.SourcesDirectory)\zap-home"
          New-Item -ItemType Directory -Force -Path $zapHome | Out-Null

          cd "C:\Program Files\ZAP\Zed Attack Proxy"

          .\zap.bat -cmd `
            -dir "$zapHome" `
            -quickurl "http://localhost:8080/JavaLoginPage" `
            -quickout "$(Build.SourcesDirectory)\zap-report.html"
            
    - task: PublishBuildArtifacts@1
      displayName: Publish ZAP Report
      inputs:
        PathtoPublish: 'zap-report.html'
        ArtifactName: 'ZAP-Report'
        publishLocation: 'Container'