trigger: none

pool:
  name: $(pool)

variables:
  - group: New variable group 22-Apr

stages:
- stage: Build
  jobs:
  - job: MavenBuild
    steps:

    - task: PowerShell@2
      displayName: Check Java and Maven
      inputs:
        targetType: 'inline'
        script: |
          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"
          $env:PATH="$($env:JAVA_HOME)\bin;$env:PATH"
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Write-Host "PATH = $env:PATH"
          & java -version
          & mvn --version

    - task: PowerShell@2
      displayName: Maven Clean Package
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)\JavaLoginPage'
        script: |
          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"
          $env:PATH="$($env:JAVA_HOME)\bin;D:\Shruti\Tools\apache-maven-3.9.12\bin;$env:PATH"
          & mvn clean package

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)\JavaLoginPage\target'
        ArtifactName: 'java-war'
        publishLocation: 'Container'