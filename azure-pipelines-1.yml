trigger: none

pool:
  name: $(pool)

variables:
  - group: New variable group 22-Apr

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  displayName: Build WAR

  jobs:
  - job: MavenBuild

    steps:

    # Java + Maven Check
    - task: PowerShell@2
      displayName: Check Java and Maven
      inputs:
        targetType: 'inline'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:PATH="$env:JAVA_HOME\bin;D:\Shruti\Tools\apache-maven-3.9.12\bin;$env:PATH"

          java -version
          mvn -version

    # Maven Build
    - task: PowerShell@2
      displayName: Maven Clean Package
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)\JavaLoginPage'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:PATH="$env:JAVA_HOME\bin;D:\Shruti\Tools\apache-maven-3.9.12\bin;$env:PATH"

          mvn clean package

    # Publish WAR Artifact
    - task: PublishBuildArtifacts@1
      displayName: Publish WAR Artifact
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)\JavaLoginPage\target'
        ArtifactName: 'java-war'
        publishLocation: 'Container'


# =========================
# DEPLOY STAGE
# =========================
- stage: Deploy
  displayName: Deploy to Tomcat
  dependsOn: Build

  jobs:
  - job: TomcatDeploy

    steps:

    # Download Artifact
    - download: current
      artifact: java-war

    # Stop Tomcat
    - task: PowerShell@2
      displayName: Stop Tomcat
      inputs:
        targetType: 'inline'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:CATALINA_HOME="D:\Shruti\Tools\apache-tomcat-9.0.118"

          & "$env:CATALINA_HOME\bin\shutdown.bat"

          Start-Sleep -Seconds 10

    # Clean Old Deployment
    - task: PowerShell@2
      displayName: Clean Old WAR
      inputs:
        targetType: 'inline'
        script: |

          Remove-Item `
          "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps\JavaLoginShowcase*" `
          -Recurse -Force -ErrorAction SilentlyContinue

    # Copy WAR File
    - task: PowerShell@2
      displayName: Copy WAR File
      inputs:
        targetType: 'inline'
        script: |

          Copy-Item `
          "$(Pipeline.Workspace)\java-war\*.war" `
          "D:\Shruti\Tools\apache-tomcat-9.0.118\webapps\" `
          -Force

    # Start Tomcat
    - task: PowerShell@2
      displayName: Start Tomcat
      inputs:
        targetType: 'inline'
        script: |

          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"

          $env:CATALINA_HOME="D:\Shruti\Tools\apache-tomcat-9.0.118"

          Start-Process `
          "$env:CATALINA_HOME\bin\startup.bat"

          Start-Sleep -Seconds 25

    # Verify Tomcat
    - task: PowerShell@2
      displayName: Verify Tomcat Running
      inputs:
        targetType: 'inline'
        script: |

          netstat -ano | findstr 8080

          Write-Host ""
          Write-Host "Application URL:"
          Write-Host "http://localhost:8080/JavaLoginShowcase-1.0.0"