trigger: none

pool:
  name: $(pool)

variables:
  - group: New variable group 22-Apr

stages:
- stage: Build
  jobs:
  - job: MavenBuild
    steps:

    - task: PowerShell@2
      displayName: Check Java and Maven
      inputs:
        targetType: 'inline'
        script: |
          $env:JAVA_HOME="D:\Shruti\Tools\Eclipse Adoptium\jdk-17.0.17.10-hotspot"
          $env:PATH="$($env:JAVA_HOME)\bin;$env:PATH"
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Write-Host "PATH = $env:PATH"
          & java -version
          & mvn --version
